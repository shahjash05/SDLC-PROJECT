spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sdlc_db}
    username: ${DB_USERNAME:sdlc_user}
    password: ${DB_PASSWORD:sdlc_pass}

  jpa:
    show-sql: true

  flyway:
    enabled: true

logging:
  level:
    com.sdlc.platform: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    org.flywaydb: DEBUG

management:
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-must-be-replaced-in-production-at-least-256-bits!}

