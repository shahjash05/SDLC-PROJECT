spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  flyway:
    enabled: false

  security:
    user:
      name: test
      password: test

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.sdlc.platform: DEBUG

app:
  jwt:
    secret: a-long-secure-and-random-test-jwt-secret-key-of-at-least-256-bits!
    expiration-ms: 86400000

